<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="6" fill="url(#accent)"/>

  <!-- shield mark -->
  <g transform="translate(84, 92)">
    <path d="M36 0 L72 14 V44 C72 68 55 86 36 94 C17 86 0 68 0 44 V14 Z"
          fill="none" stroke="url(#accent)" stroke-width="4"/>
    <path d="M20 44 L32 56 L54 30" fill="none" stroke="url(#accent)"
          stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="84" y="252" fill="#fafafa" font-size="76" font-weight="700"
        letter-spacing="-2">react-crash-guard</text>

  <text x="84" y="318" fill="#a1a1aa" font-size="34" font-weight="400">
    React error boundaries that catch async errors too.
  </text>

  <!-- feature row -->
  <g fill="#71717a" font-size="25">
    <text x="84" y="382">Global · Route · Feature · Async isolation</text>
    <text x="84" y="424">Sentry + CloudWatch reporting · Error classification</text>
  </g>

  <!-- code chip -->
  <g transform="translate(84, 470)">
    <rect width="560" height="66" rx="10" fill="#09090b" stroke="#27272a" stroke-width="2"/>
    <text x="26" y="42" fill="#4ade80" font-size="26"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace">npm i react-crash-guard</text>
  </g>

  <g fill="#52525b" font-size="23">
    <text x="84" y="586">TypeScript · MIT · React 18+</text>
    <text x="1116" y="586" text-anchor="end">github.com/mughalhere/react-crash-guard</text>
  </g>
</svg>
